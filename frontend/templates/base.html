<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}TruthLens{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
</head>
<body>

  <header class="navbar">
    <a href="/" class="nav-brand">TruthLens</a>
    <nav class="nav-links">
      <a href="/" class="{% block nav_home %}{% endblock %}">Home</a>
      <a href="/text" class="{% block nav_text %}{% endblock %}">Verify Text</a>
      <a href="/image" class="{% block nav_image %}{% endblock %}">Verify Image</a>
      <a href="/audio" class="{% block nav_audio %}{% endblock %}">Verify Audio</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>&copy; 2026 TruthLens &middot; AI Services Capstone &middot; Team Transformers</p>
  </footer>

  <script src="{{ url_for('static', path='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
